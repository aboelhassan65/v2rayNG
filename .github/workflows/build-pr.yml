name: Build Shizuku APK

on:
  push:
    branches:
      - shizuku-tethering
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Native Libs & libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          
          # جلب رابط libv2ray.aar الصحيح من GitHub API أو التخطي إذا كان موجوداً
          AAR_URL=$(curl -sL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep -o 'https://[^"]*\.aar' | head -n 1 || true)
          if [ -n "$AAR_URL" ]; then
            curl -L "$AAR_URL" -o V2rayNG/app/libs/libv2ray.aar
          fi
          
          # إعداد مسار Android NDK وتشغيل compile-hevtun.sh
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          if [ -f "compile-hevtun.sh" ]; then
            chmod +x compile-hevtun.sh
            ./compile-hevtun.sh || echo "Skipped hevtun compilation"
          fi

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-shizuku-apk
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
