name: Build Shizuku APK

on:
  push:
    branches:
      - shizuku-tethering
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          Tag=$(curl -s "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" | grep -Po '"tag_name": "\K.*?(?=")')
          curl -L -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/${Tag}/libv2ray.aar"

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-shizuku-debug-apk
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
